<mat-sidenav-container class="sidenav-container">
  <mat-sidenav #drawer class="sidenav" fixedInViewport
      [attr.role]="'navigation'"
      [mode]="'side'"
      [opened]="authService.isAuthenticated()">
    <mat-toolbar>Menu</mat-toolbar>
    <mat-nav-list *ngIf="authService.isAuthenticated()">
      <a mat-list-item routerLink="/feed">Home Feed</a>
      <a mat-list-item routerLink="/profile">Profile</a>
      
      <div *ngIf="authService.isAdmin()">
        <mat-divider></mat-divider>
        <h3 mat-subheader>Admin</h3>
        <a mat-list-item routerLink="/admin/dashboard">Dashboard</a>
        <a mat-list-item routerLink="/admin/create-poll">Create Poll</a>
        <a mat-list-item routerLink="/admin/manage-polls">Manage Polls</a>
        <a mat-list-item routerLink="/admin/users">User Management</a>
      </div>
    </mat-nav-list>
  </mat-sidenav>
  <mat-sidenav-content>
    <mat-toolbar color="primary">
      <button
        type="button"
        aria-label="Toggle sidenav"
        mat-icon-button
        (click)="drawer.toggle()"
        *ngIf="authService.isAuthenticated()">
        <mat-icon aria-label="Side nav toggle icon">menu</mat-icon>
      </button>
      <span>PollApp</span>
      <span class="spacer"></span>
      <button mat-button *ngIf="!authService.isAuthenticated()" routerLink="/auth/login">Login</button>
      <button mat-button *ngIf="!authService.isAuthenticated()" routerLink="/auth/register">Register</button>
      <button mat-button *ngIf="authService.isAuthenticated()" (click)="logout()">Logout</button>
    </mat-toolbar>
    <div class="content-container">
      <router-outlet></router-outlet>
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
