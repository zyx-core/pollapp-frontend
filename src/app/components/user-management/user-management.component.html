<div class="user-management-container">
  <div class="header">
    <h2>User Management</h2>
  </div>

  <table mat-table [dataSource]="users" class="mat-elevation-z2 full-width table-container">
    
    <!-- Name Column -->
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef> Name </th>
      <td mat-cell *matCellDef="let element"> 
        <div style="display: flex; align-items: center; gap: 8px;">
          <mat-icon color="primary">account_circle</mat-icon>
          {{element.name}} 
        </div>
      </td>
    </ng-container>

    <!-- Email Column -->
    <ng-container matColumnDef="email">
      <th mat-header-cell *matHeaderCellDef> Email </th>
      <td mat-cell *matCellDef="let element"> {{element.email}} </td>
    </ng-container>

    <!-- Role Column -->
    <ng-container matColumnDef="role">
      <th mat-header-cell *matHeaderCellDef> Role </th>
      <td mat-cell *matCellDef="let element"> 
        <span class="role-badge" [ngClass]="{'admin': element.role === 'Admin'}">{{element.role}}</span>
      </td>
    </ng-container>

    <!-- Team Name Column -->
    <ng-container matColumnDef="teamName">
      <th mat-header-cell *matHeaderCellDef> Team Name </th>
      <td mat-cell *matCellDef="let element"> {{element.teamName || 'N/A'}} </td>
    </ng-container>

    <!-- Active Status Column -->
    <ng-container matColumnDef="isActive">
      <th mat-header-cell *matHeaderCellDef> Active Status </th>
      <td mat-cell *matCellDef="let element"> 
        <mat-slide-toggle [(ngModel)]="element.isActive" (change)="toggleActive(element)" [disabled]="element.role === 'Admin'"></mat-slide-toggle>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
</div>
