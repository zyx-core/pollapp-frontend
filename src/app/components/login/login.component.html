<div class="auth-container">
  <mat-card class="auth-card">
    <mat-card-header>
      <mat-card-title>Login</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Email</mat-label>
          <input matInput type="email" formControlName="email" required>
          <mat-error *ngIf="loginForm.get('email')?.hasError('required')">Email is required</mat-error>
          <mat-error *ngIf="loginForm.get('email')?.hasError('email')">Invalid email</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Password</mat-label>
          <input matInput type="password" formControlName="password" required>
          <mat-error *ngIf="loginForm.get('password')?.hasError('required')">Password is required</mat-error>
        </mat-form-field>

        <mat-checkbox formControlName="rememberMe">Remember Me</mat-checkbox>

        <div class="error-message" *ngIf="error">{{ error }}</div>

        <button mat-flat-button color="primary" class="full-width mt-16" type="submit" [disabled]="!loginForm.valid">LOGIN</button>
      </form>
    </mat-card-content>
    <mat-card-actions style="justify-content: center;">
      <p>Don't have an account? <a routerLink="/auth/register">Register</a></p>
    </mat-card-actions>
  </mat-card>
</div>
