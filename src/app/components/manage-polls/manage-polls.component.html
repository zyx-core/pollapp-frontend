<div class="manage-polls-container">
  <div class="header">
    <h2>Manage Polls</h2>
    <button mat-flat-button color="primary" routerLink="/admin/create-poll">
      <mat-icon>add</mat-icon> CREATE POLL
    </button>
  </div>

  <table mat-table [dataSource]="polls" class="mat-elevation-z2 full-width table-container">
    
    <!-- Title Column -->
    <ng-container matColumnDef="title">
      <th mat-header-cell *matHeaderCellDef> Title </th>
      <td mat-cell *matCellDef="let element"> {{element.title}} </td>
    </ng-container>

    <!-- Status Column -->
    <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef> Status </th>
      <td mat-cell *matCellDef="let element">
        <span class="status-badge" [ngClass]="{'closed': element.status === 'Closed'}">{{element.status}}</span>
      </td>
    </ng-container>

    <!-- Start Date Column -->
    <ng-container matColumnDef="startDate">
      <th mat-header-cell *matHeaderCellDef> Start Date </th>
      <td mat-cell *matCellDef="let element"> {{element.startDate | date:'shortDate'}} </td>
    </ng-container>

    <!-- End Date Column -->
    <ng-container matColumnDef="endDate">
      <th mat-header-cell *matHeaderCellDef> End Date </th>
      <td mat-cell *matCellDef="let element"> {{element.endDate | date:'shortDate'}} </td>
    </ng-container>

    <!-- Total Votes Column -->
    <ng-container matColumnDef="totalVotes">
      <th mat-header-cell *matHeaderCellDef> Total Votes </th>
      <td mat-cell *matCellDef="let element"> {{element.totalVotes}} </td>
    </ng-container>

    <!-- Publish Results Column -->
    <ng-container matColumnDef="publishResults">
      <th mat-header-cell *matHeaderCellDef> Publish Results </th>
      <td mat-cell *matCellDef="let element"> 
        <mat-slide-toggle [(ngModel)]="element.resultsPublished" (change)="togglePublish(element)"></mat-slide-toggle>
      </td>
    </ng-container>

    <!-- Actions Column -->
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef> Actions </th>
      <td mat-cell *matCellDef="let element">
        <button mat-icon-button color="primary" [routerLink]="['/polls', element.id]" title="View Poll">
          <mat-icon>visibility</mat-icon>
        </button>
        <button mat-icon-button color="accent" (click)="closePoll(element)" *ngIf="element.status !== 'Closed'" title="Close Early">
          <mat-icon>block</mat-icon>
        </button>
        <button mat-icon-button color="warn" (click)="deletePoll(element)" title="Delete">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>

  <mat-paginator 
    [length]="totalLength"
    [pageSize]="pageSize"
    [pageSizeOptions]="[10, 25, 50]"
    (page)="onPageChange($event)">
  </mat-paginator>
</div>
